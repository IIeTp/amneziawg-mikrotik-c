name: Sync Codex branch after upstream release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Merge the current upstream main even without a new release
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: codex-upstream-release-sync
  cancel-in-progress: false

env:
  CODEX_BRANCH: codex/routeros-app-full-cycle

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check latest upstream release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/timbrs/amneziawg-mikrotik-c/releases/latest)"

          if [[ "$status" == "404" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$status" != "200" ]]; then
            cat "$response_file"
            exit 1
          fi

          tag="$(jq --exit-status --raw-output '.tag_name' "$response_file")"
          git check-ref-format --allow-onelevel "$tag"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Merge upstream main into Codex branch
        id: merge
        env:
          FORCE_SYNC: ${{ github.event.inputs.force == 'true' }}
          RELEASE_FOUND: ${{ steps.release.outputs.found }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin "$CODEX_BRANCH"
          git checkout --force -B "$CODEX_BRANCH" "origin/$CODEX_BRANCH"
          git remote add upstream https://github.com/timbrs/amneziawg-mikrotik-c.git
          git fetch --no-tags upstream \
            "+refs/heads/main:refs/remotes/upstream/main"

          if [[ "$RELEASE_FOUND" == "true" ]]; then
            git fetch --no-tags upstream \
              "refs/tags/$RELEASE_TAG:refs/tags/upstream/$RELEASE_TAG"

            release_commit="$(git rev-parse --verify "refs/tags/upstream/$RELEASE_TAG^{commit}")"
            if [[ "$FORCE_SYNC" != "true" ]] &&
              git merge-base --is-ancestor "$release_commit" HEAD; then
              echo "needs_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "$FORCE_SYNC" != "true" ]]; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff --no-commit upstream/main; then
            git checkout --ours -- \
              .github/workflows/routeros-app-oci.yml \
              routeros-app/Makefile \
              routeros-app/scripts \
              app-store.yml
            git checkout --theirs -- README.md
            while IFS= read -r path; do
              git checkout --theirs -- "$path"
            done < <(git diff --name-only --diff-filter=U | grep '^routeros-app/proxy-src/' || true)
            if git cat-file -e ":3:src/test_dns.c" 2>/dev/null; then
              git show ":3:src/test_dns.c" > routeros-app/proxy-src/test_dns.c
            fi
            git rm --ignore-unmatch -- \
              Makefile \
              Dockerfile \
              build-c.sh \
              README_en.md \
              docs/configurator.html \
              scripts/mkdockertar-c.sh \
              scripts/mkdockertar.sh \
              src/test_dns.c

            unresolved="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$unresolved" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$unresolved" >&2
              exit 1
            fi
          fi

          git add --all
          if [[ "$RELEASE_FOUND" == "true" ]]; then
            merge_message="chore: sync upstream/main after release $RELEASE_TAG"
          else
            merge_message="chore: manually sync upstream/main"
          fi
          git commit -m "$merge_message"
          echo "needs_merge=true" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.merge.outputs.needs_merge == 'true'
        run: make -C routeros-app test

      - name: Push merged upstream changes
        if: steps.merge.outputs.needs_merge == 'true'
        run: git push origin "HEAD:refs/heads/$CODEX_BRANCH"

      - name: Publish RouterOS App images
        if: steps.merge.outputs.needs_merge == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/routeros-app-oci.yml/dispatches \
            --data "{\"ref\":\"$CODEX_BRANCH\"}"
