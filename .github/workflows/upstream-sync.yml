name: Sync released upstream changes

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check latest upstream release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/timbrs/amneziawg-mikrotik-c/releases/latest)"

          if [[ "$status" == "404" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$status" != "200" ]]; then
            cat "$response_file"
            exit 1
          fi

          tag="$(jq --exit-status --raw-output '.tag_name' "$response_file")"
          git check-ref-format --allow-onelevel "$tag"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Merge the released upstream tag
        id: merge
        if: steps.release.outputs.found == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git remote add upstream https://github.com/timbrs/amneziawg-mikrotik-c.git
          git fetch --no-tags upstream \
            "refs/tags/$RELEASE_TAG:refs/tags/upstream/$RELEASE_TAG"

          release_commit="$(git rev-parse --verify "refs/tags/upstream/$RELEASE_TAG^{commit}")"

          if git merge-base --is-ancestor "$release_commit" HEAD; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff "$release_commit" \
            -m "chore: sync upstream release $RELEASE_TAG"
          echo "needs_merge=true" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.merge.outputs.needs_merge == 'true'
        run: make test

      - name: Push merged release
        if: steps.merge.outputs.needs_merge == 'true'
        run: git push origin HEAD:main

      - name: Publish Docker image
        if: steps.merge.outputs.needs_merge == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish-awg-proxy-ghcr.yml/dispatches \
            --data '{"ref":"main"}'
