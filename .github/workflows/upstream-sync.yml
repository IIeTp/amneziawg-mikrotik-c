name: Sync with Upstream

on:
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/timbrs/amneziawg-mikrotik-c.git || true
          git fetch upstream main --tags

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          MAIN_HEAD=$(git rev-parse origin/main)
          
          if [ "$UPSTREAM_HEAD" != "$MAIN_HEAD" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "upstream_sha=${UPSTREAM_HEAD:0:7}" >> $GITHUB_OUTPUT
            
            COMMITS=$(git log origin/main..upstream/main --oneline | wc -l)
            echo "commits_count=$COMMITS" >> $GITHUB_OUTPUT
            
            COMMITS_LIST=$(git log origin/main..upstream/main --pretty=format:"- %h %s" | head -30)
            echo "commits_list<<EOF" >> $GITHUB_ENV
            echo "$COMMITS_LIST" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch
        if: steps.check.outputs.has_updates == 'true'
        run: |
          BRANCH_NAME="sync/upstream-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH_NAME
          
          git merge --no-ff upstream/main \
            -m "chore: merge upstream/main (${{ steps.check.outputs.upstream_sha }})" \
            -X ours || true
          
          git push origin $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = process.env.BRANCH_NAME;
            const commitsList = process.env.commits_list;
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: sync upstream/main (${{ steps.check.outputs.upstream_sha }})`,
              head: branchName,
              base: 'main',
              body: `## 🔄 Automated Upstream Sync

**Upstream:** [timbrs/amneziawg-mikrotik-c](https://github.com/timbrs/amneziawg-mikrotik-c)
**New commits:** ${{ steps.check.outputs.commits_count }}
**Latest commit:** \`${{ steps.check.outputs.upstream_sha }}\`

### New commits from upstream:
\`\`\`
${commitsList}
\`\`\`

### What to do:
1. Review the changes
2. Merge this PR if everything looks good
3. Our local changes are automatically preserved
`
            });
            
            console.log(`✅ PR created: ${pr.html_url}`);
