name: Sync Codex branch with upstream

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: codex-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        id: merge
        run: |
          branch="$GITHUB_REF_NAME"
          git check-ref-format --branch "$branch"
          git remote add upstream https://github.com/timbrs/amneziawg-mikrotik-c.git
          git fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff upstream/main \
            -m "chore: merge upstream/main ($(git rev-parse --short upstream/main))"
          echo "needs_merge=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        if: steps.merge.outputs.needs_merge == 'true'
        run: make -C routeros-app test

      - name: Push merged changes
        if: steps.merge.outputs.needs_merge == 'true'
        run: git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Publish RouterOS App images
        if: steps.merge.outputs.needs_merge == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/routeros-app-oci.yml/dispatches \
            --data "{\"ref\":\"$GITHUB_REF_NAME\"}"
