name: Sync Codex branch after upstream release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Merge the current upstream main even without a new release
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: codex-upstream-release-sync
  cancel-in-progress: false

env:
  CODEX_BRANCH: codex/routeros-app-full-cycle

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check latest upstream release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/timbrs/amneziawg-mikrotik-c/releases/latest)"

          if [[ "$status" == "404" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$status" != "200" ]]; then
            cat "$response_file"
            exit 1
          fi

          tag="$(jq --exit-status --raw-output '.tag_name' "$response_file")"
          git check-ref-format --allow-onelevel "$tag"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Rebase Codex branch onto upstream main
        id: rebase
        env:
          FORCE_SYNC: ${{ github.event.inputs.force == 'true' }}
          RELEASE_FOUND: ${{ steps.release.outputs.found }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin "$CODEX_BRANCH"
          source_head="$(git rev-parse "origin/$CODEX_BRANCH")"
          git checkout --force -B "$CODEX_BRANCH" "$source_head"
          git remote add upstream https://github.com/timbrs/amneziawg-mikrotik-c.git
          git fetch --no-tags upstream \
            "+refs/heads/main:refs/remotes/upstream/main"

          if [[ "$RELEASE_FOUND" == "true" ]]; then
            git fetch --no-tags upstream \
              "refs/tags/$RELEASE_TAG:refs/tags/upstream/$RELEASE_TAG"

            release_commit="$(git rev-parse --verify "refs/tags/upstream/$RELEASE_TAG^{commit}")"
            if [[ "$FORCE_SYNC" != "true" ]] &&
              git merge-base --is-ancestor "$release_commit" HEAD; then
              echo "needs_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "$FORCE_SYNC" != "true" ]]; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rebase keeps upstream as the complete base and reapplies the
          # Codex commits on top. During a rebase, "theirs" is the commit
          # being replayed, so it is the correct side for local conflicts.
          set +e
          GIT_EDITOR=true git rebase --rebase-merges --strategy-option=theirs upstream/main
          rebase_status=$?
          set -e

          while [[ "$rebase_status" -ne 0 ]]; do
            if [[ ! -d .git/rebase-merge && ! -d .git/rebase-apply ]]; then
              exit "$rebase_status"
            fi

            rebase_head="$(git rev-parse --verify REBASE_HEAD 2>/dev/null || true)"
            is_merge_commit=false
            if [[ -n "$rebase_head" ]] &&
              [[ "$(git rev-list --parents -n 1 "$rebase_head" | wc -w)" -gt 2 ]]; then
              is_merge_commit=true
            fi

            while IFS= read -r -d '' path; do
              if [[ "$is_merge_commit" == "true" ]]; then
                # Preserve the existing Codex merge result while migrating
                # the old history onto the current upstream base.
                if git cat-file -e "$source_head:$path" 2>/dev/null; then
                  git checkout "$source_head" -- "$path"
                  git add -- "$path"
                else
                  git rm --ignore-unmatch -- "$path"
                fi
              elif git cat-file -e ":3:$path" 2>/dev/null; then
                git checkout --theirs -- "$path"
                git add -- "$path"
              else
                git rm --ignore-unmatch -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            unresolved="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$unresolved" ]]; then
              printf 'Unexpected rebase conflicts:\n%s\n' "$unresolved" >&2
              exit 1
            fi

            set +e
            GIT_EDITOR=true git rebase --continue
            rebase_status=$?
            set -e

            if [[ "$rebase_status" -ne 0 ]] &&
              [[ -z "$(git diff --name-only --diff-filter=U)" ]] &&
              git diff --cached --quiet && git diff --quiet; then
              GIT_EDITOR=true git rebase --skip
              rebase_status=$?
            fi
          done

          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
          echo "needs_rebase=true" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.rebase.outputs.needs_rebase == 'true'
        run: make -C routeros-app test

      - name: Push rebased Codex branch
        if: steps.rebase.outputs.needs_rebase == 'true'
        run: git push --force-with-lease="refs/heads/$CODEX_BRANCH:${{ steps.rebase.outputs.source_head }}" origin "HEAD:refs/heads/$CODEX_BRANCH"

      - name: Publish RouterOS App images
        if: steps.rebase.outputs.needs_rebase == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/routeros-app-oci.yml/dispatches \
            --data "{\"ref\":\"$CODEX_BRANCH\"}"
